<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>사회공헌사업단 패밀리 사이트 · 시안</title>
<style>
:root{--paper:#F7F6F3;--ink:#1A1917;--mid:#6B6862;--line:#E0DDD6;--pine:#2F5D4F}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);line-height:1.7;
 font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
.w{max-width:620px;margin:0 auto;padding:44px 24px 64px}
.tag{font-size:11px;letter-spacing:.14em;color:var(--pine);font-weight:700;margin:0 0 10px}
h1{font-size:25px;margin:0 0 10px;letter-spacing:-.02em}
.lede{color:var(--mid);font-size:15px;margin:0 0 30px}
a.card{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);
 border-radius:13px;padding:20px 22px;margin-bottom:13px;transition:border-color .15s}
a.card:hover,a.card:focus-visible{border-color:var(--pine);outline:none}
a.card b{display:block;font-size:17px;margin-bottom:3px}
a.card span{color:var(--mid);font-size:14px}
.note{margin-top:26px;padding:14px 16px;border-left:2px solid var(--pine);background:#fff;
 border-radius:0 9px 9px 0;font-size:13.5px;color:var(--mid)}
.note b{color:var(--ink)}
</style>
</head>
<body>
<div class="w">

  <a class="card" href="./jeju/"><b>제주자랑(주)</b><span>제주 특산 브랜드 · 기념·추모 라인</span></a>

</div>
