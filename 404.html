<script>
(function () {
  var DEST = "https://www.csrworks.co.kr";
  var BASE = "/csrworks-family-preview";
  var RULES = [["/jeju/","/store/"]];
  var p = location.pathname;
  if (BASE && p.indexOf(BASE) === 0) p = p.slice(BASE.length);
  if (p.charAt(0) !== "/") p = "/" + p;
  for (var i = 0; i < RULES.length; i++) {
    if (p.indexOf(RULES[i][0]) === 0) { p = RULES[i][1] + p.slice(RULES[i][0].length); break; }
  }
  location.replace(DEST + p + location.search + location.hash);
})();
</script>
